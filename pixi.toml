[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "flowchain-lab"
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.0"

[tasks]
seed = { cmd = "python seed_db.py", description = "Seed the database with sample data" }
lookup = { args = [ { arg = "order_id", default = "1002" } ], cmd = "python order_lookup.py {{ order_id }}", description = "Lookup an order by ID" }
run_pipeline = { args = [ { arg = "order_id", default = "1002" } ], cmd = "python langchain_pipeline.py {{ order_id }}", description = "Run the langchain pipeline" }

[dependencies]
python = "3.14.*"
langchain = ">=1.3.18,<2"
langchain-core = ">=1.6.1,<2"

[feature.dev.dependencies]
pytest = "*"

[feature.dev.tasks]
test = "pytest -q"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
